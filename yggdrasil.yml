# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that runs it (yggdrasil's
# docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images (pinned by version and
# digest, which Renovate keeps up to date), commands, globs and the names of Jenkins credentials. The commands are
# scripts under ci/ that run from the repository's root, so you can run them on your own machine too.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe gui-challenges <this repository's checkout>

checks:
  lint: # npm ci at the root, then its lint script: eslint over the demos' scripts (eslint.config.mjs)
    image: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    run: ci/lint.sh

  build: # the Deploy workflow's builds: npm ci and npm run build in every demo's directory; there are no tests
    image: node:24.22.2-bookworm@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
    run: ci/build.sh
